name: tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"

jobs:
  unittest:
    # Windows is the primary deployment target (Hermes under %LOCALAPPDATA%),
    # and the README advertises 3.11 | 3.12 — CI must back both claims.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run unit test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
