name: Simulation soak acceptance

on:
  workflow_dispatch:
    inputs:
      days:
        description: Accelerated replay duration in days (1-3)
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3"]

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run accelerated acceptance replay
        run: >-
          cgm-agent simulate
          --max-speed
          --days "${{ inputs.days }}"
          --time-base original
          --user-id ci-soak-user
          --out-dir .runtime/simulation/soak

      - name: Verify machine-readable acceptance result
        run: |
          python -c "import json, pathlib; p=json.loads(pathlib.Path('.runtime/simulation/soak/simulation_report.json').read_text()); assert p['status']=='ok' and p['acceptance']['passed'], p"

      - name: Replay same database to verify restart idempotency
        run: >-
          cgm-agent simulate
          --max-speed
          --days "${{ inputs.days }}"
          --time-base original
          --user-id ci-soak-user
          --db-path .runtime/simulation/soak/app.db
          --out-dir .runtime/simulation/soak-replay

      - name: Verify duplicate replay remains stable
        run: |
          python -c "import json, pathlib; p=json.loads(pathlib.Path('.runtime/simulation/soak-replay/simulation_report.json').read_text()); assert p['acceptance']['checks']['duplicate_replay_downstream_idempotent'], p"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-soak-${{ inputs.days }}d
          path: .runtime/simulation/
          retention-days: 14
