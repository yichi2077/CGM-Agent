[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cgm-agent"
version = "0.1.0"
description = "Personal CGM AI agent project built around Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Personal implementation" }]
dependencies = [
    "cryptography>=45,<47",
    "pydantic>=2,<3",
    # zoneinfo has no OS tz database to fall back on under Windows — the Hermes
    # runtime target. Without tzdata every ZoneInfo("Asia/Shanghai") lookup
    # (scheduler, reports, simulation, consolidation) raises
    # ZoneInfoNotFoundError on a fresh Windows install.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers",
]

[project.scripts]
cgm-agent = "hermes_cgm_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hermes_cgm_agent.knowledge" = ["*.json"]
